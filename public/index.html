<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');
    </style>
</head>

<body>
    <header>
        <div class="navbar">
            <div class="logo">
                <img src="/assets/sun.svg" alt="weather">
                <h4>Cloud Status</h4>
            </div>
            <div class="search">
                <input type="text" id="input" placeholder="🔍︎   Search for a city">
            </div>
            <div class="theme"><button id="theme"></button></div>
        </div>

    </header>

    <main>
        <div class="weathercard">
            <div class="location">
                <img src="/assets/loc.png" alt="">
                <span id="info1">New Delhi,IN</span>
            </div>
            <div class="temp">↻</div>
            <div class="description">Partly Clouds</div>
        </div>

        <!-- Details Section Card! -->

        <div class="info">
            <div class="details">
                <div class="card">
                    <p>
                        <img src="/assets/humidity.png" alt="">Humidity
                    </p>
                    <div>
                        <h1 class="humid">⏳</h1><span>%</span>
                    </div>
                </div>

                <div class="card">
                    <p>
                        <img src="/assets/wind.png" alt="">Wind
                    </p>
                    <div>
                        <h1 class="wind">⏳</h1><span>km/h</span>
                    </div>
                </div>
                <div class="card">
                    <p>
                        <img src="/assets/eye.png" alt="">Visibility
                    </p>
                    <div>
                        <h1 class="vcbility">⏳</h1><span>km</span>
                    </div>
                </div>

                <div class="card">
                    <p>
                        <img src="/assets/pressure.png" alt="">Pressure
                    </p>
                    <div>
                        <h1 class="pressure">⏳</h1><span>hPa</span>
                    </div>
                </div>
                <div class="feels card">
                    <p>
                        <img src="/assets/feels.png" alt="">Feels Like
                    </p>
                    <div>
                        <h1 class="feels_like">⏳</h1><span>°C</span>
                    </div>
                </div>
            </div>
            <div class="sun">
                <div class="rise">
                    Sunrise
                    <h1 class="srise">--</h1>
                </div>
                <div class="set">Sunset
                    <h1 class="sset">--</h1>
                </div>
            </div>
        </div>

    </main>
    <footer>
        Powered by openweather
    </footer>

    <script src="script.js"></script>
</body>

</html>
